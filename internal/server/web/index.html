<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mgit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M4 2v12M12 6v8' stroke='%235C8FD6' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M4 6c0 2 8 0 8 2' stroke='%235C8FD6' stroke-width='2' fill='none'/%3E%3Ccircle cx='4' cy='2.5' r='2' fill='%235C8FD6'/%3E%3Ccircle cx='12' cy='13.5' r='2' fill='%23B8860F'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#FBFBFD; --panel:#FFFFFF; --raise:#F3F6F9; --sunk:#EBEFF4;
  --line:#DDE4EC; --line-soft:#EAEEF3;
  --ink:#181D24; --ink-2:#414B57; --muted:#6A7580;
  --accent:#8A5D0C; --accent-bg:#FBF0D8; --accent-line:#DFC286; --accent-solid:#B8860F;
  --add:#2A7743; --add-bg:#E7F4EB; --del:#AC3838; --del-bg:#FBEBEB;
  --sel:#E2ECF8; --sel-line:#B4CFEC;
  --l0:#3F73B8; --l1:#4E8C4A; --l2:#A9518A; --l3:#237E7A; --l4:#6C5CB0; --l5:#B24F4F;
  --on-accent:#FFFFFF;
  --syn-kw:#8250A8; --syn-str:#137A4E; --syn-com:#7C8894; --syn-num:#A85A18;
  --syn-type:#1F6E86; --syn-anno:#8A5D0C; --syn-fn:#2C5FA8;
  --sb:#C7D0DB; --sb-hover:#A8B4C3; --sb-active:#8C9AAB;
  --shadow:0 1px 2px rgba(20,30,45,.05),0 4px 12px rgba(20,30,45,.05);
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","Cascadia Mono",ui-monospace,Consolas,"D2Coding",monospace;
  --row:32px;
}
/* 다크 토큰. OS 설정을 기본으로 따르되, 앱 안에서 고른 값(data-theme)이 항상 이긴다. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#13161B; --panel:#191D23; --raise:#21262E; --sunk:#0E1115;
    --line:#2C333C; --line-soft:#242A32;
    --ink:#DCE3EA; --ink-2:#AAB5C1; --muted:#7A8591;
    --accent:#E3B15A; --accent-bg:#2A2317; --accent-line:#5E4C26; --accent-solid:#E3B15A;
    --add:#67AE74; --add-bg:#15241A; --del:#D07373; --del-bg:#271818;
    --sel:#1C2634; --sel-line:#33485F;
    --l0:#5C8FD6; --l1:#6FA86A; --l2:#C0709C; --l3:#4FA3A0; --l4:#8D7ECB; --l5:#CB6E6E;
    --on-accent:#13161B;
    --syn-kw:#C39BE8; --syn-str:#7FC49A; --syn-com:#6E7A87; --syn-num:#E0A46A;
    --syn-type:#6FC3D6; --syn-anno:#E3B15A; --syn-fn:#82AEE8;
    --sb:#3A434E; --sb-hover:#4C5763; --sb-active:#606C7A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#13161B; --panel:#191D23; --raise:#21262E; --sunk:#0E1115;
  --line:#2C333C; --line-soft:#242A32;
  --ink:#DCE3EA; --ink-2:#AAB5C1; --muted:#7A8591;
  --accent:#E3B15A; --accent-bg:#2A2317; --accent-line:#5E4C26; --accent-solid:#E3B15A;
  --add:#67AE74; --add-bg:#15241A; --del:#D07373; --del-bg:#271818;
  --sel:#1C2634; --sel-line:#33485F;
  --l0:#5C8FD6; --l1:#6FA86A; --l2:#C0709C; --l3:#4FA3A0; --l4:#8D7ECB; --l5:#CB6E6E;
  --on-accent:#13161B;
  --syn-kw:#C39BE8; --syn-str:#7FC49A; --syn-com:#6E7A87; --syn-num:#E0A46A;
  --syn-type:#6FC3D6; --syn-anno:#E3B15A; --syn-fn:#82AEE8;
  --sb:#3A434E; --sb-hover:#4C5763; --sb-active:#606C7A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}

/* 스크롤바 — 기본 위젯은 폭이 넓고 트랙이 회색 판으로 떠서 패널 경계를 흐린다.
   투명 트랙 + 얇은 알약 손잡이로 바꾸고, 배경 위에 떠 있게 보이도록 여백을 준다. */
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px;
  border:3px solid transparent;background-clip:content-box;min-height:36px}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover);background-clip:content-box}
::-webkit-scrollbar-thumb:active{background:var(--sb-active);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

.app{height:100%;display:flex;flex-direction:column}
.titlebar{display:flex;align-items:center;gap:12px;padding:0 13px;height:44px;flex:none;
  background:var(--raise);border-bottom:1px solid var(--line)}
.repo{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none}
.repo b{color:var(--ink);font-weight:600}
.viewsw{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);
  border-radius:7px;padding:2px;flex:none}
.viewsw button{font-family:var(--sans);font-size:12px;padding:3px 13px;border:0;border-radius:5px;
  background:none;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;
  align-items:center;gap:6px}
.viewsw button:hover{color:var(--ink-2)}
.viewsw button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600}
.viewsw button:focus-visible{outline:2px solid var(--l0);outline-offset:1px}
.viewsw button .g{font-family:var(--mono);font-size:11px;opacity:.85}
.cmdbox{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;max-width:520px;
  background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:4px 5px 4px 10px}
.cmdbox span{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none;font-weight:700}
.cmdbox code{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.copybtn{flex:none;font-size:11px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:4px;padding:2px 8px;cursor:pointer}
.copybtn:hover{color:var(--ink);border-color:var(--muted)}
.iconbtn{flex:none;width:28px;height:26px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;padding:0}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}
.iconbtn:focus-visible{outline:2px solid var(--l0);outline-offset:1px}
.iconbtn[disabled]{opacity:.5;cursor:default}
.iconbtn.spin{animation:mgspin .9s linear infinite}
@keyframes mgspin{to{transform:rotate(360deg)}}

.body{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) var(--rail-w,396px);
  grid-template-rows:minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.graphpane,.diffpane{grid-column:1;grid-row:1}
.rail{grid-column:2;grid-row:1;border-left:1px solid var(--line);position:relative}
/* 메모 레일을 접으면 diff 가 폭을 다 쓴다. 사이드 패널처럼 좁은 화면에서 필요하다. */
.app[data-rail="off"] .body{grid-template-columns:minmax(0,1fr)}
.app[data-rail="off"] .rail{display:none}
.vsplit{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:6}
.vsplit:hover,.vsplit.dragging{background:var(--sel-line)}
.vsplit:focus-visible{outline:2px solid var(--l0);outline-offset:-2px}
body.resizing-x{cursor:col-resize;user-select:none}
.app[data-view="graph"] .diffpane{display:none}
.app[data-view="detail"] .graphpane{display:none}
/* 그래프 뷰에서는 메모 레일을 숨긴다. 목록을 훑는 화면이라 폭이 아쉽고,
   메모는 어차피 상세 뷰에서 코드 옆에 붙어 나온다. */
.app[data-view="graph"] .rail{display:none}
.app[data-view="graph"] .body{grid-template-columns:minmax(0,1fr)}

.panehead{flex:none;display:flex;align-items:center;gap:11px;height:38px;padding:0 13px;
  border-bottom:1px solid var(--line-soft)}
.panehead h2{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);flex:none}
.panehead .meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.panehead .btn{flex:none}
.chk{flex:none;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);
  cursor:pointer;user-select:none;white-space:nowrap}
.chk:hover{color:var(--ink)}
.chk input{margin:0;cursor:pointer;accent-color:var(--l0)}
.chk input:focus-visible{outline:2px solid var(--l0);outline-offset:2px}
.scroller{flex:1;min-height:0;overflow:auto}

/* ── 커밋 목록 ─────────────────────────────────────────────────── */
.ginner{position:relative}
/* 그래프 열도 폭을 줄일 수 있어야 한다. 레인이 많으면(14개면 240px) 좁은 화면에서
   설명을 다 잡아먹는다. 줄이면 바깥 레인부터 잘려 나간다 — 잘라도 주 계보는 남는다. */
.lanesclip{position:absolute;left:0;top:0;bottom:0;width:var(--w-graph,240px);
  overflow:hidden;pointer-events:none}
.lanes{position:absolute;left:0;top:0}
.gspace{flex:none;width:var(--w-graph,240px)}
.crow{display:flex;align-items:center;height:var(--row);cursor:pointer;padding-right:13px;
  border-left:2px solid transparent}
.crow:hover{background:var(--raise)}
.crow.sel{background:var(--sel);border-left-color:var(--l0)}
.crow:focus-visible{outline:2px solid var(--l0);outline-offset:-2px}
.gspace{flex:none}
.csubj{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:13px;color:var(--ink);padding-right:14px}
.crow.merge .csubj{color:var(--ink-2)}
/* 메타 컬럼은 폭을 조절할 수 있다(0 까지 줄이면 숨겨진다). 좁은 사이드 패널에서
   설명이 잘리지 않게 하려면 필수. 헤더와 행이 같은 변수를 써야 어긋나지 않는다. */
.cmeta{flex:none;display:flex;align-items:center;font-family:var(--mono);font-size:11px;
  color:var(--muted);font-variant-numeric:tabular-nums}
/* 여백은 별도 변수로 둔다. border-box 에서 padding 은 최소 폭이 되므로, 폭을 0 으로
   접어도 padding 만큼 남아 글자가 삐져나온다. 접힐 때 같이 0 이 되어야 한다. */
.cmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.cmeta .au{width:var(--w-au,82px);padding-right:var(--p-au,12px)}
.cmeta .dt{width:var(--w-dt,104px);padding-right:var(--p-dt,12px)}
.cmeta .sh{width:var(--w-sh,74px);color:var(--ink-2)}

/* 행과 같은 우측 여백을 줘야 컬럼 경계가 어긋나지 않는다 (.crow 의 padding-right). */
.chead{display:flex;align-items:center;height:24px;background:var(--sunk);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4;padding-right:13px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);
  text-transform:uppercase;user-select:none}
.chead .ch-graph{flex:none;width:var(--w-graph,240px);position:relative;padding-left:3px;
  overflow:hidden;white-space:nowrap}
.chead .ch-dot{flex:none;width:22px}
.chead .ch-subj{flex:1;min-width:0;padding-left:2px}
.chead .ch-col{position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:right}
.chead .ch-col[data-col="au"]{width:var(--w-au,82px);padding-right:var(--p-au,12px)}
.chead .ch-col[data-col="dt"]{width:var(--w-dt,104px);padding-right:var(--p-dt,12px)}
.chead .ch-col[data-col="sh"]{width:var(--w-sh,74px)}
.chead .grip{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.chead .grip::before{content:"";position:absolute;left:3px;top:4px;bottom:4px;width:1px;
  background:var(--line)}
.chead .grip:hover::before,.chead .grip.dragging::before{background:var(--l0);width:2px;left:2px}
/* 그래프 열만 손잡이가 오른쪽 경계(설명과의 사이)에 붙는다.
   .grip 뒤에 와야 left 를 덮어쓴다 — 명시도가 같으므로 순서가 곧 우선순위다. */
.chead .grip-r{left:auto;right:-3px}
.chip{flex:none;display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;
  border-radius:3px;border:1px solid;margin-right:5px;white-space:nowrap;max-width:210px;
  overflow:hidden;text-overflow:ellipsis;vertical-align:1px;line-height:1.4}
.chip.tag{color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}
.chip.head{color:var(--l1);border-color:var(--l1);background:transparent;font-weight:600}
.chip.branch,.chip.remote{color:var(--l0);border-color:var(--sel-line);background:var(--sel)}
.notedot{flex:none;width:22px;display:flex;align-items:center;justify-content:center}
.notedot b{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--on-accent);
  background:var(--accent-solid);border-radius:9px;min-width:15px;height:15px;padding:0 3px;
  display:grid;place-items:center;line-height:1}

/* ── 그래프 하단 패널 + 크기 조절 ──────────────────────────────── */
.splitter{flex:none;height:6px;cursor:row-resize;background:var(--line-soft);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.splitter:hover,.splitter.dragging{background:var(--sel-line)}
.splitter:focus-visible{outline:2px solid var(--l0);outline-offset:-2px}
/* 하단 패널을 접으면 구분선은 남겨 둔다. 더블클릭으로 다시 펼칠 자리가 필요하다. */
.app[data-gdetail="off"] .gdetail{display:none}
.app[data-gdetail="off"] .splitter{cursor:pointer}
.splitter::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:34px;height:2px;border-radius:2px;background:var(--muted);opacity:.5}
.gdetail{flex:none;height:280px;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--panel)}
.gdetail .gd-info{min-width:0;overflow:auto;padding:12px 14px;border-right:1px solid var(--line)}
.gdetail .gd-files{min-width:0;overflow:auto}
.gd-info .gsubj{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.45;
  margin-bottom:9px;overflow-wrap:anywhere}
.gd-info dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;
  font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.gd-info dt{color:var(--muted);white-space:nowrap}
.gd-info dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.gd-info .gbody{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:12.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.gd-files .gf-head{position:sticky;top:0;background:var(--sunk);padding:6px 13px;
  border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;
  color:var(--muted);display:flex;gap:10px;align-items:center}
.gf-row{display:flex;align-items:center;gap:10px;padding:5px 13px;cursor:pointer;
  border-bottom:1px solid var(--line-soft)}
.gf-row:hover{background:var(--raise)}
.gf-row:focus-visible{outline:2px solid var(--l0);outline-offset:-2px}
.gf-row .fp{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.gf-row .st{flex:none;font-family:var(--mono);font-size:11px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.gf-row .st .a{color:var(--add)} .gf-row .st .d{color:var(--del)}

/* ── 상세 뷰 ───────────────────────────────────────────────────── */
.cdetail{flex:none;padding:11px 14px 12px;border-bottom:1px solid var(--line);background:var(--raise)}
.cdetail .subj{font-size:13.5px;font-weight:550;color:var(--ink);line-height:1.45;
  text-wrap:balance;margin-bottom:6px;overflow-wrap:anywhere}
.cdetail .line2{display:flex;flex-wrap:wrap;gap:5px 14px;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cdetail .line2 .sha{color:var(--ink-2);font-weight:600}

/* 파일마다 독립된 카드로 떼어 놓는다. 예전엔 전부 붙어 있어 어디서 파일이
   바뀌는지 눈으로 못 찾았다. */
.filecard{margin:14px 13px;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--panel);box-shadow:var(--shadow)}
.filecard:first-child{margin-top:13px}
.filecard:last-child{margin-bottom:24px}
.filehead{display:flex;align-items:center;gap:10px;padding:8px 13px;background:var(--raise);
  border-bottom:1px solid var(--line);cursor:pointer}
.filehead .fold{flex:none;width:14px;color:var(--muted);font-family:var(--mono);font-size:10px;
  text-align:center;transition:transform .12s}
.filecard.collapsed .fold{transform:rotate(-90deg)}
.filecard.collapsed .filebody{display:none}
.filehead .fp{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.filehead .fp .dir{color:var(--muted);font-weight:400}
.filehead .st{flex:none;font-family:var(--mono);font-size:11px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.filehead .st .a{color:var(--add)} .filehead .st .d{color:var(--del)}
.filebody{overflow-x:auto}
.hunk{border-top:1px solid var(--line-soft)}
.hunk:first-child{border-top:0}
.hunkhead{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--sunk);
  padding:4px 13px;border-bottom:1px solid var(--line-soft);position:sticky;left:0}
.dline{display:flex;font-family:var(--mono);font-size:12px;line-height:20px;min-width:min-content}
.dline .gut{flex:none;width:92px;display:flex;color:var(--muted);font-size:10.5px;
  font-variant-numeric:tabular-nums;user-select:none;border-right:1px solid var(--line-soft);
  position:sticky;left:0;background:var(--panel);z-index:1}
.dline.add .gut{background:var(--add-bg)} .dline.del .gut{background:var(--del-bg)}
.dline .gut i{width:33px;text-align:right;padding-right:5px;font-style:normal}
.dline .gut .addbtn{width:26px;text-align:center;color:var(--line);cursor:pointer;font-style:normal;
  font-family:var(--sans);font-size:12px;line-height:20px}
.dline:hover .gut .addbtn{color:var(--accent-solid)}
.dline .gut .addbtn:hover{background:var(--accent-bg)}
.dline .gut .addbtn:focus-visible{outline:2px solid var(--accent-solid);outline-offset:-2px;
  color:var(--accent-solid)}
.dline .sig{flex:none;width:15px;text-align:center;user-select:none}
.dline .txt{flex:1;white-space:pre;padding-right:18px}
.dline.add{background:var(--add-bg)} .dline.add .sig{color:var(--add)}
.dline.del{background:var(--del-bg)} .dline.del .sig{color:var(--del)}
/* 메모가 덮는 줄. 범위면 시작~끝 전체에 띠가 걸리고, 위아래 끝만 모서리를 준다. */
.dline.noted .gut{box-shadow:inset 3px 0 0 var(--accent-solid)}
.dline.noted .gut .addbtn{color:var(--accent-solid)}
.dline.noted .txt{background:var(--accent-bg)}
.dline.noted-top .txt{box-shadow:inset 0 1px 0 var(--accent-line)}
.dline.noted-bot .txt{box-shadow:inset 0 -1px 0 var(--accent-line)}
.dline.noted-top.noted-bot .txt{box-shadow:inset 0 1px 0 var(--accent-line),inset 0 -1px 0 var(--accent-line)}
/* 범위를 고르는 중인 줄 — 저장 전 미리보기 */
.dline.picking .txt{background:var(--accent-bg);opacity:.95}
.dline.picking .gut{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-bg)}

/* 문법 강조 */
.tok-kw{color:var(--syn-kw)}
.tok-str{color:var(--syn-str)}
.tok-com{color:var(--syn-com);font-style:italic}
.tok-num{color:var(--syn-num)}
.tok-type{color:var(--syn-type)}
.tok-anno{color:var(--syn-anno)}
.tok-fn{color:var(--syn-fn)}

.inote{background:var(--accent-bg);border-top:1px solid var(--accent-line);
  border-bottom:1px solid var(--accent-line);border-left:3px solid var(--accent-solid);
  padding:9px 16px 10px 89px;position:sticky;left:0}
.inote.done{background:var(--raise);border-top-color:var(--line-soft);
  border-bottom-color:var(--line-soft);border-left-color:var(--line)}
.inote.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%,30%{box-shadow:inset 0 0 0 2px var(--accent-solid)}100%{box-shadow:none}}
.inote .ih{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.inote .iat{flex:1;min-width:0;font-family:var(--mono);font-size:10.5px;color:var(--accent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inote.done .iat{color:var(--muted)}
.inote .ibody{font-size:13px;line-height:1.55;color:var(--ink);white-space:pre-wrap;
  overflow-wrap:anywhere;max-width:72ch}
.inote .ires{margin-top:6px;font-size:12px;color:var(--muted);border-left:2px solid var(--line);
  padding-left:9px;max-width:72ch;line-height:1.5}
.inote .iact{margin-top:9px;display:flex;gap:6px}
/* 답글 — 부모 박스 안에서 한 칸 들여 대화처럼 이어 붙는다. */
.inote .ireply{margin-top:9px;padding-left:11px;border-left:2px solid var(--accent-line)}
.inote.done .ireply{border-left-color:var(--line)}
.inote .ireply .ih{margin-bottom:3px}
.inote .ireply .iat{flex:1;color:var(--muted)}
.inote .ireply .ibody{font-size:12.5px;color:var(--ink-soft,var(--ink))}
.composer.reply{margin-top:9px;border:1px solid var(--accent-line);border-radius:6px;
  padding:8px;background:var(--raise);position:static}
.composer.reply textarea{min-height:56px}

.composer{background:var(--accent-bg);border-top:1px solid var(--accent-line);
  border-bottom:1px solid var(--accent-line);padding:10px 14px 11px 92px;position:sticky;left:0}
.composer.commit{padding-left:14px}
.composer textarea{width:100%;min-height:62px;resize:vertical;font-family:var(--sans);font-size:13px;
  color:var(--ink);background:var(--panel);border:1px solid var(--accent-line);border-radius:6px;
  padding:8px 10px;line-height:1.5}
.composer textarea:focus{outline:2px solid var(--accent-solid);outline-offset:-1px}
.composer .cf{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.composer .cf .at{font-family:var(--mono);font-size:11px;color:var(--accent);margin-right:auto;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font-family:var(--sans);font-size:12px;border-radius:6px;padding:5px 12px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.btn.pri{background:var(--accent-solid);border-color:var(--accent-solid);color:var(--on-accent);
  font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{font-size:11.5px;padding:3px 9px;border-radius:5px}
.btn:focus-visible{outline:2px solid var(--l0);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}

.tabs{flex:none;display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{flex:1;font-size:12px;padding:9px 4px;background:none;border:0;
  border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tab .n{font-family:var(--mono);font-size:10px;margin-left:4px;opacity:.8}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-solid);
  background:var(--raise);font-weight:600}
.tab:focus-visible{outline:2px solid var(--l0);outline-offset:-2px}
.tabpane{flex:1;min-height:0;overflow:auto;display:none}
.tabpane.on{display:block}

.notegrp{padding:10px 13px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.notegrp .ln{flex:1;height:1px;background:var(--line-soft)}
.note{padding:10px 13px 11px;border-bottom:1px solid var(--line-soft);
  border-left:3px solid transparent;cursor:pointer}
.note:hover{background:var(--raise)}
.note:focus-visible{outline:2px solid var(--l0);outline-offset:-2px}
.note.open{border-left-color:var(--accent-solid)}
.note.done{opacity:.6}
.note .nh{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.note .nid{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:700}
.note .nst{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:1px 6px;
  border-radius:3px;border:1px solid var(--accent-line);color:var(--accent);background:var(--accent-bg)}
.note.done .nst{border-color:var(--line);color:var(--muted);background:var(--raise)}
.note .nx{margin-left:auto;font-size:12px;color:var(--muted);border:0;background:none;
  cursor:pointer;padding:1px 3px;border-radius:4px;line-height:1}
.note .nx:hover{color:var(--del);background:var(--del-bg)}
.note .nloc{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .nbody{font-size:12.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;
  overflow-wrap:anywhere}
.note .nres{margin-top:6px;font-size:11.5px;color:var(--muted);border-left:2px solid var(--line);
  padding-left:8px;white-space:pre-wrap;line-height:1.5}
.note .nact{margin-top:8px;display:flex;gap:6px}
/* 레일에서도 답글은 한 칸 들여 붙인다. */
.note .nreply{margin-top:7px;padding-left:9px;border-left:2px solid var(--line-soft)}
.note .nreply .nid{display:block;margin-bottom:2px;color:var(--muted)}
.note .nreply .nbody{font-size:12px;color:var(--muted)}
.emptyish{padding:26px 16px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.7}
.cli{margin:0;padding:12px 13px;font-family:var(--mono);font-size:11.5px;line-height:1.7;
  white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.railfoot{flex:none;border-top:1px solid var(--line);padding:8px 13px;display:flex;gap:7px;
  align-items:center;background:var(--raise)}
.railfoot .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:auto;
  font-variant-numeric:tabular-nums}
.err{margin:11px 13px;padding:9px 12px;border:1px solid var(--del);border-radius:7px;
  color:var(--del);background:var(--del-bg);font-size:12.5px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;
  background:var(--ink);color:var(--ground);font-size:12.5px;padding:8px 15px;border-radius:8px;
  box-shadow:0 6px 22px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
/* ── 파일 전문 뷰어 ────────────────────────────────────────────────
   diff 는 헝크 주변만 보여주므로 앞뒤 맥락이 필요할 때 파일 전체를 겹쳐 띄운다.
   진짜 새 창이 아니라 이 화면 위 오버레이다. */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;
  justify-content:center;padding:28px}
.overlay[hidden]{display:none}
.ov-backdrop{position:absolute;inset:0;background:rgba(10,14,20,.55);backdrop-filter:blur(2px)}
.ov-panel{position:relative;display:flex;flex-direction:column;width:min(1100px,100%);
  height:min(880px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:11px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.4)}
.ov-head{flex:none;display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:var(--raise);border-bottom:1px solid var(--line)}
.ov-path{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.ov-path .dir{color:var(--muted);font-weight:400}
.ov-meta{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ov-body{flex:1;min-height:0;overflow:auto;background:var(--panel)}
.fvline{display:flex;font-family:var(--mono);font-size:12px;line-height:20px;min-width:min-content}
.fvline .no{flex:none;width:64px;text-align:right;padding-right:12px;color:var(--muted);
  font-size:10.5px;user-select:none;border-right:1px solid var(--line-soft);
  position:sticky;left:0;background:var(--panel);z-index:1}
.fvline .code{flex:1;white-space:pre;padding:0 18px 0 12px}
/* 이 커밋에서 바뀐 줄은 표시해 둔다 — 전문 안에서 diff 위치를 잃지 않도록. */
.fvline.changed{background:var(--add-bg)}
.fvline.changed .no{background:var(--add-bg);box-shadow:inset 3px 0 0 var(--add);
  color:var(--add);font-weight:700}
.fvline.flash{animation:fvfl 1.6s ease-out}
@keyframes fvfl{0%,35%{background:var(--accent-bg)}100%{}}
body.resizing{cursor:row-resize;user-select:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>
// 저장된 테마를 첫 페인트 전에 적용한다. 나중에 붙이면 밝은 화면이 한 번 번쩍인다.
try {
  var t = localStorage.getItem("mgit.theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
</head>
<body>
<div class="app" id="app" data-view="graph" data-gdetail="on" data-rail="on">
  <div class="titlebar">
    <div class="repo" id="repo">…</div>
    <div class="viewsw">
      <button id="v-graph" type="button" aria-pressed="true"><span class="g">⑂</span>그래프</button>
      <button id="v-detail" type="button" aria-pressed="false"><span class="g">◧</span>상세</button>
    </div>
    <div class="cmdbox">
      <span>$</span><code id="cmd">mgit</code>
      <button class="copybtn" id="copy" type="button">복사</button>
    </div>
    <button class="iconbtn" id="fetch" type="button" title="원격에서 가져오기 (git fetch)"
            aria-label="원격에서 가져오기">⟳</button>
    <button class="iconbtn" id="theme" type="button" title="테마 전환 (자동 → 라이트 → 다크)"
            aria-label="테마 전환">◐</button>
  </div>

  <div class="body">
    <section class="pane graphpane">
      <div class="panehead">
        <h2>커밋 그래프</h2>
        <label class="chk" title="현재 브랜치(HEAD)와 그 조상만 보여준다">
          <input type="checkbox" id="scopehead"> 현재 브랜치만
        </label>
        <div class="meta" id="graphmeta"></div>
        <button class="btn sm" id="togglegd" type="button" aria-expanded="true"
                title="하단 패널 접기/펼치기 (구분선 더블클릭으로도 됩니다)">▼ 하단 패널</button>
        <button class="btn sm" id="godetail" type="button">상세 보기 →</button>
      </div>
      <div class="scroller" id="gscroll">
        <div class="chead" id="chead">
          <div class="ch-graph" data-col="graph">그래프<span class="grip grip-r" tabindex="0"
               role="separator" aria-label="그래프 열 너비"></span></div>
          <div class="ch-dot"></div>
          <div class="ch-subj">설명</div>
          <div class="ch-col" data-col="au"><span class="grip" tabindex="0" role="separator"
               aria-label="작성자 열 너비"></span>작성자</div>
          <div class="ch-col" data-col="dt"><span class="grip" tabindex="0" role="separator"
               aria-label="날짜 열 너비"></span>날짜</div>
          <div class="ch-col" data-col="sh"><span class="grip" tabindex="0" role="separator"
               aria-label="커밋 열 너비"></span>커밋</div>
        </div>
        <div class="ginner" id="ginner">
          <div class="lanesclip"><svg class="lanes" id="lanes" aria-hidden="true"></svg></div>
          <div class="rows" id="rows"></div>
        </div>
      </div>
      <div class="splitter" id="gsplit" role="separator" aria-orientation="horizontal"
           tabindex="0" aria-label="하단 패널 크기 조절"></div>
      <div class="gdetail" id="gdetail">
        <div class="gd-info" id="gdinfo"></div>
        <div class="gd-files" id="gdfiles"></div>
      </div>
    </section>

    <section class="pane diffpane">
      <div class="panehead">
        <button class="btn sm" id="gograph" type="button">← 그래프</button>
        <h2>변경 내용</h2>
        <div class="meta" id="diffmeta"></div>
        <button class="btn sm" id="togglerail" type="button" aria-expanded="true"
                title="메모 영역 접기/펼치기 (경계선 드래그로 너비 조절)">메모 ▶</button>
      </div>
      <div class="cdetail" id="cdetail"></div>
      <div class="scroller" id="dscroll"><div class="diffbody" id="diffbody"></div></div>
    </section>

    <aside class="pane rail">
      <div class="vsplit" id="railsplit" tabindex="0" role="separator"
           aria-orientation="vertical" aria-label="메모 영역 너비 조절"></div>
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-notes" role="tab" aria-selected="true" aria-controls="p-notes" type="button">메모<span class="n" id="tabn"></span></button>
        <button class="tab" id="tab-cli" role="tab" aria-selected="false" aria-controls="p-cli" type="button">note export</button>
      </div>
      <div class="tabpane on" id="p-notes" role="tabpanel" aria-labelledby="tab-notes"></div>
      <div class="tabpane" id="p-cli" role="tabpanel" aria-labelledby="tab-cli"><pre class="cli" id="cliout"></pre></div>
      <div class="railfoot">
        <span class="cnt" id="notecnt"></span>
        <button class="btn sm" id="addcommit" type="button">커밋 메모</button>
        <button class="btn sm" id="filterbtn" type="button">전체 보기</button>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="overlay" id="fileview" hidden>
  <div class="ov-backdrop" id="fvbackdrop"></div>
  <div class="ov-panel" role="dialog" aria-modal="true" aria-labelledby="fvtitle">
    <div class="ov-head">
      <span class="ov-path" id="fvtitle"></span>
      <span class="ov-meta" id="fvmeta"></span>
      <button class="btn sm" id="fvjump" type="button" title="이 커밋에서 바뀐 첫 줄로">변경 위치</button>
      <button class="iconbtn" id="fvclose" type="button" title="닫기 (Esc)" aria-label="닫기">✕</button>
    </div>
    <div class="ov-body" id="fvbody"></div>
  </div>
</div>

<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
